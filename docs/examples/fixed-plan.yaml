schema_version: 1
kind: fixed_workflow_plan
status: design_only
name: saleor-two-sprints
roles: roles.yaml

# 外部绑定由运行入口提供；不能把这些逻辑标识当作已有文件。
required_inputs:
  business_brief: {type: document}
  base_repos: {type: repository_snapshot}
  sprint2_request: {type: document}
  deployment_target: {type: deployment_target}

policy:
  progression: forward_only
  on_failure: stop
  accepted_artifacts: immutable
  stage_sandbox: rebuild_from_declared_inputs
  max_submission_retries: 1
  automatic_stage_skip: false

sprints:
  - id: sprint1
    stages:
      - id: pm
        role: pm
        inputs:
          task: input:business_brief
          source: input:base_repos
        outputs:
          prd: {type: document, path: PRD.md}
        checks: [required_outputs, source_unchanged]

      - id: architect
        role: architect
        inputs:
          task: input:business_brief
          source: input:base_repos
          prd: artifact:sprint1/pm/prd
        outputs:
          tdd: {type: document, path: TDD.md}
        checks: [required_outputs, source_unchanged, input_digests_unchanged]

      - id: code
        role: developer
        inputs:
          task: input:business_brief
          source: input:base_repos
          prd: artifact:sprint1/pm/prd
          tdd: artifact:sprint1/architect/tdd
        outputs:
          candidate: {type: repository_snapshot, capture: workspace.repos}
          implementation: {type: document, path: implementation.md}
          developer_tests: {type: execution_evidence, capture: runner.developer_tests}
        checks: [required_outputs, candidate_integrity, input_digests_unchanged]

      - id: qa
        role: qa
        inputs:
          prd: artifact:sprint1/pm/prd
          tdd: artifact:sprint1/architect/tdd
          candidate: artifact:sprint1/code/candidate
          implementation: artifact:sprint1/code/implementation
          developer_tests: artifact:sprint1/code/developer_tests
        outputs:
          tests: {type: test_bundle, path: qa-tests/}
          results: {type: execution_evidence, capture: runner.qa_tests}
          report: {type: document, path: qa-report.md}
        checks: [required_outputs, production_source_unchanged, candidate_binding]

      - id: deploy
        role: deployer
        inputs:
          candidate: artifact:sprint1/code/candidate
          qa_results: artifact:sprint1/qa/results
          qa_tests: artifact:sprint1/qa/tests
          qa_report: artifact:sprint1/qa/report
          tdd: artifact:sprint1/architect/tdd
          target: input:deployment_target
        requires:
          - {check: execution_passed, evidence: qa_results, subject: candidate}
        outputs:
          config: {type: directory, path: deployment-config/}
          delivery: {type: deployment_manifest, path: delivery.yaml}
          health: {type: execution_evidence, capture: runner.deployment_health}
        checks: [required_outputs, candidate_binding, test_bundle_binding, deployment_identity, deployment_healthy]

  - id: sprint2
    stages:
      - id: code
        role: developer
        inputs:
          task: input:sprint2_request
          source: artifact:sprint1/code/candidate
          prd: artifact:sprint1/pm/prd
          tdd: artifact:sprint1/architect/tdd
          prior_qa: artifact:sprint1/qa/report
          prior_deployment: artifact:sprint1/deploy/delivery
        outputs:
          candidate: {type: repository_snapshot, capture: workspace.repos}
          implementation: {type: document, path: implementation.md}
          developer_tests: {type: execution_evidence, capture: runner.developer_tests}
        checks: [required_outputs, candidate_integrity, input_digests_unchanged]

      - id: qa
        role: qa
        inputs:
          task: input:sprint2_request
          prd: artifact:sprint1/pm/prd
          tdd: artifact:sprint1/architect/tdd
          candidate: artifact:sprint2/code/candidate
          implementation: artifact:sprint2/code/implementation
          developer_tests: artifact:sprint2/code/developer_tests
          prior_tests: artifact:sprint1/qa/tests
        outputs:
          tests: {type: test_bundle, path: qa-tests/}
          results: {type: execution_evidence, capture: runner.qa_tests}
          report: {type: document, path: qa-report.md}
        checks: [required_outputs, production_source_unchanged, candidate_binding]

      - id: deploy
        role: deployer
        inputs:
          candidate: artifact:sprint2/code/candidate
          qa_results: artifact:sprint2/qa/results
          qa_tests: artifact:sprint2/qa/tests
          qa_report: artifact:sprint2/qa/report
          tdd: artifact:sprint1/architect/tdd
          previous_delivery: artifact:sprint1/deploy/delivery
          previous_config: artifact:sprint1/deploy/config
          target: input:deployment_target
        requires:
          - {check: execution_passed, evidence: qa_results, subject: candidate}
        outputs:
          config: {type: directory, path: deployment-config/}
          delivery: {type: deployment_manifest, path: delivery.yaml}
          health: {type: execution_evidence, capture: runner.deployment_health}
        checks: [required_outputs, candidate_binding, test_bundle_binding, deployment_identity, deployment_healthy]
