schema_version = "1.3"

[task]
name = "sdlcbench/saleor-3.23"
description = "Saleor Core and Dashboard 3.23 migration"
authors = []
keywords = ["multi-repository", "offline", "migration"]

[metadata]
task_id = "saleor-3.23"
release_id = "saleor-3.23-pruned-20260927-01"
status = "calibrated-verified"
repositories_manifest = "manifest.json"

[environment]
docker_image = "sdlcbench/saleor-3.23-env:build-0a5d5bc656cb"
os = "linux"
cpus = 8
memory_mb = 16384
storage_mb = 40960
build_timeout_sec = 7200.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 7200.0

[verifier.environment]
cpus = 8
memory_mb = 16384
storage_mb = 40960
build_timeout_sec = 7200.0

[[verifier.collect]]
command = "mkdir -p /logs/artifacts; (cd /workspace/saleor && git add -N . && git diff --binary --full-index c864e66b8e537d30732ddba62d3a4c47e49e4a3e -- > /logs/artifacts/saleor.model.patch) && (cd /workspace/saleor-dashboard && git add -N . && git diff --binary --full-index aebb2401b5079fbbb8c60150289d1896c108feca -- > /logs/artifacts/saleor-dashboard.model.patch)"
timeout_sec = 300.0
