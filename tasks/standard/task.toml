schema_version = "1.3"

[task]
name = "sdlcbench/saleor-3.23"
description = "Saleor 3.23 self-contained standard Harbor delivery package"
authors = []
keywords = ["multi-repository", "offline", "calibrated"]

[metadata]
task_id = "saleor-3.23"
release_id = "saleor-3.23-calibration-20260920"
status = "frozen"
base_commit = "6cfb77430ddbc53f48dfd3462fbefaad4e8c3d45"
repositories_manifest = "manifest.json"

[environment]
docker_image = "sdlcbench/saleor-3.23-base:standard-a-20260920"
os = "linux"
cpus = 8
memory_mb = 16384
storage_mb = 40960
build_timeout_sec = 7200.0

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 7200.0

[verifier.environment]
cpus = 8
memory_mb = 16384
storage_mb = 40960
build_timeout_sec = 7200.0

[[verifier.collect]]
command = "mkdir -p /logs/artifacts; (cd /workspace/saleor && git add -N . && git diff --binary --full-index 6cfb77430ddbc53f48dfd3462fbefaad4e8c3d45 > /logs/artifacts/saleor.model.patch) && (cd /workspace/saleor-dashboard && git add -N . && git diff --binary --full-index e934ff0abf5e643d2e8eab5cce609387fe0e37b6 > /logs/artifacts/saleor-dashboard.model.patch)"
timeout_sec = 300.0
